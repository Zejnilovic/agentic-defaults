name: Session feedback
description: A kit file made an agent go wrong in a session. With agd 0.2.0 or newer, `agd feedback` fills this in for you.
title: "<What went wrong>"
body:
  - type: markdown
    attributes:
      value: |
        Report one problem with one kit file. If you asked the agent to "retro this session", its note in `.local_context/feedback/` has these fields; copy them over.
        Leave out secrets, customer data and private code.
  - type: input
    id: kit-version
    attributes:
      label: Kit version
      description: From the first line of your project's AGENTS.md.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Claude Code
        - GitHub Copilot
        - Other
    validations:
      required: true
  - type: input
    id: models
    attributes:
      label: Models
      placeholder: "sonnet and haiku"
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      description: How the task ended.
      options:
        - done
        - partly done
        - failed
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict
      description: From the retro note, if you have one.
      options:
        - went well
        - mixed
        - went badly
  - type: input
    id: kit-file
    attributes:
      label: Kit file
      description: The file's path as installed in your project.
      placeholder: ".claude/skills/tdd/SKILL.md"
    validations:
      required: true
  - type: dropdown
    id: cause
    attributes:
      label: Cause
      description: What was wrong with the file's rule.
      options:
        - missing
        - wrong
        - ignored
        - too long
        - not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked for, what the agent did, what you had to correct, and what tests or reviews caught afterwards.
    validations:
      required: true
  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed fix
      description: The change to the kit file that would have prevented it, if you have one.
