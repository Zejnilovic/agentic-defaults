name: Check kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      # Run every OS to the end, so a failure on one doesn't hide the result of the other.
      fail-fast: false
      matrix:
        # macOS runs the scripts on bash 3.2, the oldest bash they support.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so check.py can compare kit/ with the last release tag.
          fetch-depth: 0
      - name: Consistency checks
        run: python3 scripts/check.py
      - name: Script tests
        run: python3 -m unittest discover -s tests -v
