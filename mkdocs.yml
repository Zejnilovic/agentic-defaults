# The documentation site, https://zejnilovic.github.io/agentic-defaults, built from docs/ by the Docs workflow.
# Preview it: pip install -r docs/requirements.txt, then mkdocs serve.
site_name: Zejnilovic's agentic defaults
site_description: Sensible defaults for agentic coding in Claude Code and GitHub Copilot. Test-first, reasonable coverage, and context that stays current.
site_url: https://zejnilovic.github.io/agentic-defaults/
repo_url: https://github.com/Zejnilovic/agentic-defaults
repo_name: Zejnilovic/agentic-defaults
edit_uri: edit/master/docs/
copyright: MIT License © Sasa Zejnilovic

# methodology.md is published at zejnilovic.eu; it links into kit/, which the site doesn't contain.
exclude_docs: |
  methodology.md
  requirements.txt

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/robot-outline
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Zejnilovic/agentic-defaults
      name: agentic-defaults on GitHub

nav:
  - Home: index.md
  - The method: https://zejnilovic.eu/guides/working-with-coding-agents
  - Get started:
      - Quick start: start.md
      - Choose your path: paths.md
  - What's inside:
      - Overview: inside.md
      - Agents: agents.md
      - Skills: skills.md
      - Packs: packs.md
  - Working with it:
      - How work flows: workflow.md
      - Fit it to your project: project.md
      - Keep CONTEXT.md current: context.md
  - Your copy:
      - Kit files and your files: your-files.md
      - Claude Code and Copilot: tools.md
  - More:
      - Feedback and contributing: feedback.md
      - Releases: https://github.com/Zejnilovic/agentic-defaults/releases
      - Installer (agd): https://zejnilovic.github.io/agd

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
